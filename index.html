<style>

  .ent-card {

<!-- ===== 开场介绍 ===== -->
<header class="hero">
  <div class="badge">深圳市分析测试协会 · 抱团养老</div>
  <h1>荣休新青年 结群欢乐计划</h1>

  html += '<div class="home-sec"><h3>按区域浏览<em>广东省内 / 省外</em></h3><div class="home-grid">';

/* 按导航 key 过滤 */
function filterBy(key) {
  if (!key || key === 'all') return ROUTES;
  if (key === '省内' || key === '省外') return ROUTES.filter(r => r.group === key);
  if (key.indexOf('省内-') === 0) {
    const d = parseInt(key.split('-')[1], 10);
    return ROUTES.filter(r => r.group === '省内' && parseInt(r.days, 10) === d);
  }
  if (key.indexOf('省外-') === 0) {
    const sub = key.slice(3);
    return ROUTES.filter(r => r.group === '省外' && r.sub === sub);
  }
  if (key.indexOf('d-') === 0) {
    const d = parseInt(key.slice(2), 10);
    return ROUTES.filter(r => parseInt(r.days, 10) === d);
  }
  return ROUTES;
}

/* 列表页的分组方式：省内按天数、省外按子区域、天数分类单组 */
function listGroups(key) {
  const list = filterBy(key);
  if (key === 'all') {
    return [
      { label:'省内线路', list: list.filter(r => r.group === '省内') },
      { label:'省外线路', list: list.filter(r => r.group === '省外') }
    ].filter(g => g.list.length);
  }
  if (key === '省内') {
    return DAY_TIERS.map(t => ({
      label: t.label, list: list.filter(r => parseInt(r.days, 10) === t.day)
    })).filter(g => g.list.length);
  }
  if (key === '省外') {
    return ['邻省', '湾区', '国内', '祖国边疆'].map(s => ({
      label: s, list: list.filter(r => r.sub === s)
    })).filter(g => g.list.length);
  }
  return [{ label: navLabel(key), list }];
}

function navLabel(key) {
  for (const n of NAV_AREA) {
    if (n.key === key) return n.label;
    if (n.children) {
      const c = n.children.find(x => x.key === key);
      if (c) return n.label + ' · ' + c.label;
    }
  }
  const d = NAV_DAYS.find(x => x.key === key);
  return d ? d.label : '';
}

/* ---- 渲染侧栏 ---- */
function renderSide() {
  const side = document.getElementById('rpSide');

  let html = '<button class="side-close" onclick="toggleSide(false)">✕</button>';
  html += '<div class="side-seg">' +
            `<button class="${navMode === 'area' ? 'on' : ''}" data-mode="area">按区域</button>` +
            `<button class="${navMode === 'days' ? 'on' : ''}" data-mode="days">按天数</button>` +
          '</div>';

  if (navMode === 'area') {
    html += '<div class="side-cap">区域分类</div>';
    NAV_AREA.forEach(n => {
      const n2 = filterBy(n.key).length;
      if (!n2) return;                                  /* 内容为 0 的分类不显示 */
      const isOn = navKey === n.key;
      if (n.children) {
        const kids = n.children.filter(c => filterBy(c.key).length);
        const openCls = (openNav === n.key || navKey.indexOf(n.key + '-') === 0) ? ' open' : '';
        html += `<div class="nav-item${isOn ? ' on' : ''}${openCls}" data-nav="${n.key}">` +
                `<span>${n.label}</span><em>${n2}</em><i class="caret">›</i></div>`;
        if (kids.length) {
          html += `<div class="nav-sub${openCls}">`;
          kids.forEach(c => {
            const on = navKey === c.key ? ' on' : '';
            html += `<div class="nav-item sub${on}" data-nav="${c.key}"><span>${c.label}</span><em>${filterBy(c.key).length}</em></div>`;
          });
          html += '</div>';
        }
      } else {
        html += `<div class="nav-item${isOn ? ' on' : ''}" data-nav="${n.key}">` +
                `<span>${n.label}</span><em>${n2}</em></div>`;
      }
    });
  } else {
    html += '<div class="side-cap">行程天数</div>';
    NAV_DAYS.forEach(c => {
      const n = filterBy(c.key).length;
      if (!n) return;
      const on = navKey === c.key ? ' on' : '';
      html += `<div class="nav-item${on}" data-nav="${c.key}"><span>${c.label}</span><em>${n}</em></div>`;
    });
  }

  /* 未选择分类时不列任何线路 */
  if (!navKey) {
    html += '<div class="side-hint">选择上方任一分类后，这里显示对应线路</div>';
  } else {
    const list = filterBy(navKey);
    html += `<div class="side-cap" style="margin-top:14px">${navLabel(navKey)} · 共 <em>${list.length}</em> 条</div>`;
    html += '<div class="route-list">';
    if (!list.length) {
      html += '<div class="route-empty">该分类暂无线路</div>';
    } else {
      list.forEach(r => {
        const on = (view === 'route' && r.slug === curSlug) ? ' on' : '';
        html += `<div class="route-item${on}" data-slug="${r.slug}">` +
                `<img src="routes/thumbs/${r.slug}.${IMG_EXT}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` +
                `<div><div class="ri-t">${r.title}</div></div>` +
                '</div>';
      });
    }
    html += '</div>';
  }

  side.innerHTML = html;
  /* 移动端：换了分类后，侧栏自动滚回顶部，避免停在旧位置 */
  side.scrollTop = 0;
}

/* ---- 渲染图片 ---- */
function renderPages() {
  const r = ROUTES.find(x => x.slug === curSlug) || ROUTES[0];
  const body = document.getElementById('rpBody');
  document.getElementById('rpTitle').textContent = r.title;
  document.getElementById('rpCap').textContent = '行程单 · 点击图片可放大';
  document.getElementById('rpBackBtn').textContent = '‹';

  let html = `<div class="tip"></div>`;
  for (let i = 1; i <= r.pages; i++) {
    const n = String(i).padStart(2, '0');
    html += `<img class="page-img" loading="lazy" src="routes/${r.slug}/${n}.${IMG_EXT}" ` +
            `alt="${r.title} 第 ${i} 页" onclick="openViewer(this.src)" onerror="onImgError(this)">`;
  }
  body.innerHTML = html;
  body.scrollTop = 0;
}

function onImgError(el) {
  el.classList.add('fail');
  el.onclick = null;
  if (imgWarned) return;
  imgWarned = true;
  const tip = document.querySelector('.rp-body .tip');
  if (tip) tip.innerHTML += '<span class="warn">部分图片未能加载，请确认 routes 文件夹与 index.html 在同一目录</span>';
}

/* ---- 侧栏事件委托 ---- */
document.getElementById('rpSide').addEventListener('click', function (e) {
  const modeEl = e.target.closest('[data-mode]');
  if (modeEl) {
    if (navMode === modeEl.dataset.mode) return;
    navMode = modeEl.dataset.mode;
    goHome();                                          /* 切换分类方式：回到分类入口，不保留旧选择 */
    return;
  }
  const navEl = e.target.closest('[data-nav]');
  if (navEl) {
    const key = navEl.dataset.nav;
    const parent = NAV_AREA.find(n => n.key === key && n.children);
    if (key.indexOf('-') > -1) openNav = key.split('-')[0];        /* 点子项：展开其所属父级 */
    else if (parent) openNav = (openNav === key ? '' : key);       /* 点父项：切换展开 / 收起 */
    else openNav = '';                                            /* 点普通项：收起所有 */
    selectNav(key);
    return;
  }
  const rEl = e.target.closest('[data-slug]');
  if (rEl) {
    openRoute(rEl.dataset.slug);
    if (window.innerWidth < 820) toggleSide(false);
  }
});

/* 分类入口页 / 目录卡片点击 */
document.getElementById('rpBody').addEventListener('click', function (e) {
  const p = e.target.closest('[data-pick]');
  if (p) {
    const key = p.dataset.pick;
    navMode = key.indexOf('d-') === 0 ? 'days' : 'area';
    openNav = key === 'all' ? '' : (key.indexOf('-') > -1 ? key.split('-')[0] : key);
    selectNav(key);
    return;
  }
  const c = e.target.closest('[data-goto]');
  if (c) openRoute(c.dataset.goto);
});

/* 选定某个分类：进入该分类的方案列表 */
function selectNav(key) {
  navKey = key;
  if (!filterBy(key).length) { renderSide(); return; }
  renderList();
  if (window.innerWidth < 820) toggleSide(false);
}

function openViewer(src) {
  document.getElementById('viewerImg').src = src;
  document.getElementById('viewer').classList.add('show');
}
function closeViewer() {
  document.getElementById('viewer').classList.remove('show');
  document.getElementById('viewerImg').src = '';
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('viewer').classList.contains('show')) return closeViewer();
  if (document.getElementById('rpSide').classList.contains('open')) return toggleSide(false);
  if (document.getElementById('routePanel').classList.contains('show')) {
    return rpBack();
  }
  closeModal();
});

/* ==================== 分享 ==================== */
function showShareTip() {
  document.getElementById('shareTip').classList.add('show');
}
</script>
